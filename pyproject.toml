[project]
name = "job-research-agent"
version = "0.1.0"
description = "A Chinese job-market research agent powered by GPT Researcher"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "gpt-researcher==0.14.7",
  "jinja2>=3.1",
  "markdown>=3.7",
  "nh3>=0.3",
  "python-dotenv>=1.1",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

